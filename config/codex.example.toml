# Merge this block into your existing Codex config; do not replace the whole file.
# Example only: this file is not automatically loaded.
[mcp_servers.blender]
command = "uvx"
args = ["blender-mcp==1.9.1"]
enabled_tools = ["get_scene_info", "get_object_info", "execute_blender_code", "get_viewport_screenshot"]
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.blender.env]
DISABLE_TELEMETRY = "true"
BLENDER_HOST = "127.0.0.1"
BLENDER_PORT = "9876"
